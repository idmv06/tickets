<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Ticket - Plataforma Académica</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                
                <!-- contenedora -->
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        
                        <h2 class="mb-3 text-primary">Portal de Soporte Técnico</h2>
                        <p class="text-muted mb-4">Complete los datos para reportar un inconveniente con el sistema de notas o accesos.</p>

                        <!-- formulario -->
                        <form action="guardar_ticket.php" method="POST">
                            
                            <!-- asunto -->
                            <div class="mb-3">
                                <label for="asunto" class="form-label fw-bold">Asunto del problema</label>
                                <input type="text" class="form-control" id="asunto" name="asunto" required placeholder="Ej: Error al guardar notas de 10-A">
                            </div>

                            <!-- Categoría y prioridad en dos columnas -->
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="categoria" class="form-label fw-bold">Categoría</label>
                                    <select class="form-select" id="categoria" name="categoria">
                                        <option value="Notas">Registro de Notas</option>
                                        <option value="Entradas">Control de Entradas y Salidas</option>
                                        <option value="Anuncios">Módulo de Anuncios</option>
                                        <option value="General">Problema General</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="prioridad" class="form-label fw-bold">Prioridad</label>
                                    <select class="form-select" id="prioridad" name="prioridad">
                                        <option value="Baja">Baja</option>
                                        <option value="Media" selected>Media</option>
                                        <option value="Alta">Alta</option>
                                        <option value="Urgente">Urgente</option>
                                    </select>
                                </div>
                            </div>

                            <!-- descripción -->
                            <div class="mb-4">
                                <label for="descripcion" class="form-label fw-bold">Descripción detallada</label>
                                <textarea class="form-control" id="descripcion" name="descripcion" rows="4" required placeholder="Describa paso a paso el error..."></textarea>
                            </div>

                            <!-- Botón de enviar -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">Enviar Ticket de Soporte</button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
