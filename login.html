<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Plataforma Académica</title>
    <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- CSS -->
     <link href="login.css" rel="stylesheet">

</head>
<body class="bg-light d-flex align-items-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 text-center">
                        <div class="card-body p-4 text-center">
    
                     <!-- Ícono superior de usuario -->
                      <div class="mb-3">
                         <i class="bi bi-person-circle fs-1 text-primary"></i>
                        </div>

                        <h4 class="fw-bold mb-1">Módulo de Soporte</h4>
                     <p class="text-muted small mb-4">Ingrese con sus credenciales de la plataforma</p>

                        <!-- Formulario de Login -->
                        <form action="login_process.php" method="POST">
                            
                            <!-- Correo -->
                             <div class="input-group mb-3">
                                <span class="input-group-text">
                                 <i class="bi bi-envelope-at"></i>
                                  </span>
                                <div class="form-floating flex-grow-1">
                                    <input type="email" class="form-control" id="correo" name="correo" placeholder="nombre@ejemplo.com" required>
                                    <label for="correo">Correo Electrónico</label>
                                </div>
                            </div>

                            <!-- Contraseña -->
                             <div class="input-group mb-3">
                                 <span class="input-group-text">
                                 <i class="bi bi-alphabet"></i>
                                  </span>
                                <div class="form-floating flex-grow-1">
                                    <input type="password" class="form-control" id="contrasena" name="contrasena" placeholder="Contraseña" required>
                                 <label for="contrasena">Contraseña</label>
                                </div>
                            </div>

                            <!-- Botón de Ingreso -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg fs-6">
                                    Iniciar Sesión
                                </button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
